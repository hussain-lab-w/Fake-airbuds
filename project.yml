name: EW27Player
options:
  bundleIdPrefix: com.ew27
  deploymentTarget:
    iOS: "17.0"
targets:
  EW27Player:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EW27Player
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ew27.player
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "2.12"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "EW27 Player"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Access your local music library to play your songs with the equalizer."
    info:
      path: EW27Player/Info.plist
      properties:
        UIBackgroundModes:
          - audio
    scheme:
      testTargets: []
